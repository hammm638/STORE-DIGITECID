<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>Maintenance</title>
<style>
:root{--bg:#000;--g:#00ff66;--g2:#0a8f3c;--dim:#0d4d26;--warn:#ffd23f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--g);overflow:hidden}
body{font-family:"Courier New",ui-monospace,Menlo,Consolas,monospace;display:flex;align-items:center;justify-content:center;
  padding:env(safe-area-inset-top,0) 16px env(safe-area-inset-bottom,0)}
#rain{position:fixed;inset:0;width:100%;height:100%;opacity:.35}
body::after{content:"";position:fixed;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
.term{position:relative;z-index:2;width:min(640px,100%);background:rgba(0,0,0,.86);border:1px solid var(--g2);
  box-shadow:0 0 28px rgba(0,255,102,.18),inset 0 0 24px rgba(0,255,102,.05);padding:18px 18px 16px}
.bar{display:flex;gap:6px;margin-bottom:14px;color:var(--g2);font-size:12px;align-items:center}
.bar i{width:9px;height:9px;border:1px solid var(--g2);border-radius:50%}
.bar span{margin-left:auto}
h1{font-size:clamp(20px,5.2vw,30px);letter-spacing:.06em;text-shadow:0 0 10px var(--g);position:relative;display:inline-block;margin-bottom:4px}
h1::before,h1::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;overflow:hidden}
h1::before{color:#0ff;left:2px;clip-path:inset(0 0 60% 0);animation:gl 3.2s infinite steps(1)}
h1::after{color:#f0f;left:-2px;clip-path:inset(60% 0 0 0);animation:gl 3.2s infinite steps(1) reverse}
@keyframes gl{0%,90%,100%{transform:translateX(0);opacity:0}92%{transform:translateX(-3px);opacity:.8}95%{transform:translateX(3px);opacity:.8}}
.sub{color:var(--g2);font-size:13px;margin-bottom:14px}
#log{height:176px;overflow:hidden;font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
#log .ok{color:var(--g)}#log .wr{color:var(--warn)}#log .mu{color:var(--g2)}
.cur{display:inline-block;width:8px;height:14px;background:var(--g);vertical-align:-2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.prog{margin-top:12px;height:12px;border:1px solid var(--g2);position:relative;overflow:hidden}
.prog b{position:absolute;inset:0 auto 0 0;width:0;transition:width .7s ease-out;background:repeating-linear-gradient(90deg,var(--g) 0 6px,transparent 6px 8px);box-shadow:0 0 10px var(--g)}
.meta{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--g2)}
@media (prefers-reduced-motion:reduce){h1::before,h1::after{display:none}.cur{animation:none}}
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<main class="term">
  <div class="bar"><i></i><i></i><i></i><span>root@server:~#</span></div>
  <h1 data-t="SYSTEM MAINTENANCE">SYSTEM MAINTENANCE</h1>
  <p class="sub">Sistem sedang diperbarui. Mohon tunggu sebentar.</p>
  <div id="log" aria-live="off"></div>
  <div class="prog"><b id="pb"></b></div>
  <div class="meta"><span id="st">memproses...</span><span id="pc">0%</span></div>
</main>
<script>
(function(){
  /* hujan kode */
  var c=document.getElementById('rain'),x=c.getContext('2d'),fs=16,cols,drops,
      ch='01アイウエオカキクケコサシスセソタチツテトナニヌネノ#$%&<>/\\{}[]=+*'.split('');
  function size(){c.width=innerWidth;c.height=innerHeight;cols=Math.ceil(c.width/fs);drops=[];for(var i=0;i<cols;i++)drops[i]=Math.random()*-50}
  size();addEventListener('resize',size);
  function rain(){
    x.fillStyle='rgba(0,0,0,.08)';x.fillRect(0,0,c.width,c.height);
    x.font=fs+'px monospace';
    for(var i=0;i<cols;i++){
      x.fillStyle=Math.random()>.97?'#d6ffe4':'#00ff66';
      x.fillText(ch[Math.floor(Math.random()*ch.length)],i*fs,drops[i]*fs);
      if(drops[i]*fs>c.height&&Math.random()>.975)drops[i]=0;
      drops[i]++;
    }
  }
  var still=matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(!still)setInterval(rain,55);else{rain()}

  /* log terminal */
  var lines=[
    ['$ ssh admin@core-01','mu'],['[ OK ] koneksi aman terbentuk','ok'],
    ['$ systemctl stop web.service','mu'],['[ OK ] layanan dihentikan sementara','ok'],
    ['$ apt update && apt upgrade -y','mu'],['mengunduh paket pembaruan...','mu'],
    ['[ OK ] 128 paket terpasang','ok'],['$ rebuild --cache --index','mu'],
    ['[WARN] indeks sedang disusun ulang','wr'],['[ OK ] cache dibersihkan','ok'],
    ['$ chmod -R 750 /var/www','mu'],['[ OK ] izin akses diperbarui','ok'],
    ['$ verify --integrity','mu'],['[ OK ] 4096/4096 blok valid','ok'],
    ['$ systemctl start web.service','mu'],['[WAIT] menunggu layanan siap...','wr']
  ],log=document.getElementById('log'),pb=document.getElementById('pb'),pc=document.getElementById('pc'),
  st=document.getElementById('st'),cur=document.createElement('span');cur.className='cur';
  var li=0,ci=0,row=null;
  function rnd(a,b){return a+Math.random()*(b-a)}

  /* log: kecepatan bervariasi, kadang jeda panjang */
  function next(){
    if(li>=lines.length){li=0;log.textContent=''}
    row=document.createElement('div');row.className=lines[li][1];log.appendChild(row);ci=0;type();
  }
  function type(){
    var t=lines[li][0];
    if(ci<t.length){
      row.textContent=t.slice(0,++ci);row.appendChild(cur);
      setTimeout(type,still?0:(t[0]==='$'?rnd(45,110):rnd(18,48)));
    }else{
      li++;
      while(log.scrollHeight>log.clientHeight+2&&log.firstChild!==row)log.removeChild(log.firstChild);
      var d=rnd(700,1900);
      if(Math.random()<.18)d+=rnd(2000,4500);
      setTimeout(next,still?0:d);
    }
  }

  /* persen: pelan, naik tidak rata, sesekali tersendat lalu lompat */
  var pct=0,stalls={},label=['memeriksa sistem...','mengunduh pembaruan...','memasang paket...','menyusun ulang indeks...','memverifikasi data...','menyalakan layanan...'];
  [18,41,67,89].forEach(function(n){stalls[n+Math.floor(Math.random()*5)]=1});
  function setPct(v){
    pb.style.width=v+'%';pc.textContent=Math.floor(v)+'%';
    st.textContent=label[Math.min(label.length-1,Math.floor(v/17))];
  }
  function tick(){
    if(pct>=99){
      st.textContent='menunggu layanan siap...';
      setTimeout(function(){pct=0;setPct(0);tick()},still?0:rnd(9000,15000));return;
    }
    var step=Math.random()<.12?rnd(2.5,5):rnd(.2,1.6),delay=rnd(500,2600);
    pct=Math.min(99,pct+step);
    setPct(pct);
    if(stalls[Math.floor(pct)]){delete stalls[Math.floor(pct)];delay=rnd(5000,10000)}
    else if(Math.random()<.08)delay=rnd(3000,6000);
    setTimeout(tick,still?0:delay);
  }
  setPct(0);setTimeout(tick,900);
  next();
})();
</script>
</body>
</html>
